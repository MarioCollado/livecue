[tool.poetry]
name = "livecue"
version = "4.0.11-beta.2"
description = "Ableton Live setlist controller with OSC and Flet UI"
authors = ["Mario Collado Rodríguez <mcolladorguez@gmail.com>"]
license = "CC BY-NC-SA 4.0"
readme = "README.md"
packages = []  # ← Sin paquetes porque es una app, no una librería

[tool.poetry.dependencies]
python = "^3.12"
flet = "^0.28.3"
python-osc = "^1.8.0"
Flask = "^3.0.0"
Pillow = "^10.0.0"
python-dotenv = "^1.2.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
livecue = "main:main"